version: '3.9'

# ── HMG Healthcare Platform — Docker Compose ─────────────────────────────────
# Layers (per architecture):
#   hmg-app   → Client / Agentic Core
#   n8n       → Workflow Orchestration Engine
#   postgres  → Patient DB (encrypted)
#   redis     → Cache & Session
#   nginx     → Reverse Proxy / API Gateway

services:

  # ── 1. HMG App (Next.js static export) ──────────────────────────────────────
  hmg-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: hmg-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HF_TOKEN=${HF_TOKEN:-}
      - NEXT_PUBLIC_HF_TOKEN=${HF_TOKEN:-}
      - DATABASE_URL=postgresql://hmg:${POSTGRES_PASSWORD:-hmg_secret}@postgres:5432/hmg_healthcare
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_URL=http://n8n:5678
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hmg-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 2. n8n Workflow Orchestration ────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: hmg-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-hmg_n8n_2025}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=hmg
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-hmg_secret}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-hmg_encryption_key_2025}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hmg-network

  # ── 3. PostgreSQL — Patient Database ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hmg-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hmg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hmg_secret}
      - POSTGRES_MULTIPLE_DATABASES=hmg_healthcare,n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/multi-db.sh:/docker-entrypoint-initdb.d/00-multi-db.sh
    restart: unless-stopped
    networks:
      - hmg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmg -d hmg_healthcare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. Redis — Cache & Sessions ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hmg-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-hmg_redis_2025} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - hmg-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hmg_redis_2025}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 5. Nginx — Reverse Proxy / API Gateway ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hmg-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hmg-app
      - n8n
    restart: unless-stopped
    networks:
      - hmg-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  hmg-network:
    driver: bridge
