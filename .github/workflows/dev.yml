name: DEV — Build & Package

on:
  push:
    branches: [craft_appv2, main]
  pull_request:
    branches: [craft_appv2, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── 2. Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --ci --coverage
        env:
          CI: true

  # ── 3. Next.js web build ─────────────────────────────────────────────────
  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload .next build
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_number }}
          path: .next/
          retention-days: 3

  # ── 4. Electron — NSIS Windows installer (.exe) ──────────────────────────
  build-electron:
    name: Build Electron (Windows NSIS)
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: List dist output
        run: dir dist
        shell: cmd

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HMG-App-Windows-${{ github.run_number }}
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: error

  # ── 5. Summary ────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-electron]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## HMG App DEV Pipeline — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron NSIS | ${{ needs.build-electron.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### HF Models integrated" >> $GITHUB_STEP_SUMMARY
          echo "- 🎙 openai/whisper-large-v3 (voice transcription)" >> $GITHUB_STEP_SUMMARY
          echo "- 🧬 emilyalsentzer/Bio_ClinicalBERT (symptom NER)" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 aubmindlab/bert-base-arabertv02 (Arabic NLP)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔬 microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext (lab reports)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`HMG-App-Windows-${{ github.run_number }}\` — retained 7 days" >> $GITHUB_STEP_SUMMARY
